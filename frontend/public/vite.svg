<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d4b4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d5bb96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b89968;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Letter M -->
  <g transform="translate(50, 50)">
    <path d="
      M -20 -15
      L -20 20
      L -12 20
      L -12 -2
      L 0 12
      L 12 -2
      L 12 20
      L 20 20
      L 20 -15
      L 12 -15
      L 0 0
      L -12 -15
      Z
    " fill="#22243b" opacity="0.95"/>
  </g>
  
  <!-- Accent Line (underline) -->
  <line x1="25" y1="72" x2="75" y2="72" stroke="#22243b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
